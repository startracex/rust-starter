name: Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Install mdBook
        uses: taiki-e/install-action@v2.90.5
        with:
          tool: mdbook@0.5.4
      - name: Build book
        run: mdbook build ./docs
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs/book
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
